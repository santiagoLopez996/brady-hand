<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | BradyHand</title>

    <!-- <//xml//> -->

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS del login -->
    <link rel="stylesheet" href="/css/login.css">

</head>

<body>
    
<main class="login-page">

    <section class="login-card register-card">

        <a href="index.html" class="login-logo">
            <img src="/img/logo-bradyhand.png" alt="Logo BradyHand">
        </a>

        <div class="login-header">

            <h1>Crear cuenta</h1>

            <p>
                Registro para profesionales de la salud
            </p>

        </div>

        <form class="register-form" id="register-form">

            <div class="form-row">

                <div class="form-group">

                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Ingresa tu nombre">

                </div>

                <div class="form-group">

                    <label for="apellido">Apellido</label>
                    <input type="text" name="apellido" id="apellido" placeholder="Ingresa tu apellido">

                </div>                

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label for="cedula">Cedula</label>
                    <input type="number" name="cedula" id="cedula">

                </div>

                <div class="form-group">

                    <label for="entidad">Entidad de salud</label>
                    <select name="entidad" id="entidad">

                        <option value="">Seleccione</option>
                        <option value="sanitas">Sanitas</option>
                        <option value="sura">SURA</option>
                        <option value="compensar">Compensar</option>
                        <option value="otro">Otro</option>

                    </select>

                </div>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label for="genero">Genero</label>
                    <select name="genero" id="genero">

                        <option value="">Seleccione</option>
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="birth-date">Fecha de nacimiento</label>
                    <input type="date" id="birth-date" required>

                </div>

            </div>

            <div class="form-group">

                <label for="correo">Correo electronico</label>
                <input type="email" id="email" name="email" placeholder="Ingrese su correo" required>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="Ingrese su contraseña" minlength="8" required>

                    <small class="password-help">

                        Minimo 8 caracteres, una mayúscula, una minúscula y un número.

                    </small>

                </div>

                <div class="form-group">

                    <label for="confirm-password"> Confirmar Contraseña</label>
                    <input type="password" name="confirm-password" id="confirm-password" placeholder="Confirme su contraseña" minlength="8" required>

                </div>


            </div>

            <button type="submit" class="btn-login-submit">Crear Cuenta</button>

        <div class="login-divider">
            <span>o</span>
        </div>

        <button
            type="button"
            class="btn-google"
            id="btn-google"
        >
            Continuar con Google
        </button>

        </form>


        <div class="login-options">

            <p>

                ¿Ya tienes una cuenta?
                <a href="login.html">Iniciar sesion</a>

            </p>


        </div>
        

    </section>

</main>

<script type="module" src="/js/crearCuenta.js"></script>
<script type="module" src="/js/googleAuth.js"></script>

</body>

</html>
