<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Completar perfil | BradyHand</title>

    <!-- <//xml//> -->

    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Reutilizamos CSS -->
    <link rel="stylesheet" href="/css/login.css">

</head>


<body>

<main class="login-page">

    <section class="login-card complete-profile-card">

        <!-- Logo -->

        <a href="index.html" class="login-logo">

            <img
                src="/img/logo-bradyhand.png"
                alt="Logo BradyHand"
            >

        </a>


        <!-- Encabezado -->

        <div class="login-header">

            <h1>Completa tu perfil</h1>

            <p>
                Necesitamos algunos datos adicionales para finalizar tu registro.
            </p>

        </div>


        <!-- Información obtenida de Google -->

        <div class="google-user-info">

            <div class="google-info-item">

                <span>Nombre</span>

                <strong id="google-user-name">
                    Cargando...
                </strong>

            </div>


            <div class="google-info-item">

                <span>Correo electrónico</span>

                <strong id="google-user-email">
                    Cargando...
                </strong>

            </div>

        </div>


        <!-- Datos faltantes -->

        <form
            class="register-form"
            id="complete-profile-form"
        >

            <div class="form-row">

                <div class="form-group">

                    <label for="complete-id">
                        Cédula
                    </label>

                    <input
                        type="text"
                        id="complete-id"
                        placeholder="Número de cédula"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="complete-entity">
                        Entidad de salud
                    </label>

                    <select
                        id="complete-entity"
                        required
                    >

                        <option value="">
                            Seleccione
                        </option>

                        <option value="sanitas">
                            Sanitas
                        </option>

                        <option value="sura">
                            SURA
                        </option>

                        <option value="compensar">
                            Compensar
                        </option>

                        <option value="otro">
                            Otro
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="complete-gender">
                        Género
                    </label>

                    <select
                        id="complete-gender"
                        required
                    >

                        <option value="">
                            Seleccione
                        </option>

                        <option value="masculino">
                            Masculino
                        </option>

                        <option value="femenino">
                            Femenino
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="complete-birthdate">
                        Fecha de nacimiento
                    </label>

                    <input
                        type="date"
                        id="complete-birthdate"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="btn-login-submit"
            >
                Completar registro
            </button>

        </form>

    </section>

</main>

<script type="module" src="/js/completarPerfil.js"></script>

</body>

</html>
